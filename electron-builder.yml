# electron-builder 打包配置
# 文档: https://www.electron.build/

appId: com.hualin.wowlauncher
productName: 河狸乐园登录器
copyright: Copyright © 2026 河狸乐园

# Electron 下载镜像（国内加速）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

# 构建目录
directories:
  output: release-new
  buildResources: build

# 需要打包的文件（在 electron-builder 默认规则基础上叠加排除，不要正向覆盖！）
# electron-builder 默认已经包含：
#   · dist/  (vite 构建输出)
#   · electron/  (主进程代码)
#   · package.json  (版本/入口/依赖)
#   · dependencies 中的 node_modules  (自动解析，主进程 require 需要，不能丢！)
# 我们只需"额外排除"不需要的内容，不重写正向列表
files:
  # --- 排除源码/脚本/开发构建目录 ---
  - "!src/**/*"                  # Vue 源码（只需要 dist/）
  - "!scripts/**/*"              # 构建辅助脚本（客户端运行时不用）
  - "!public/**/*"               # Vite 已拷贝到 dist/，源目录不重复打包
  - "!release-new/**/*"          # 构建产物不自引用
  - "!updates/**/*"              # ⚠️ 关键：updates/asar/*.asar 不能再次被打进去（递归自包含，增加 70MB+）
  - "!.electron-builder-cache/**/*"
  - "!electron-cache/**/*"
  - "!electron-extract-temp/**/*"
  - "!build/**/*"                # build/ 里的 icon 只通过 extraResources 引用，files 里不需要重复
  - "!data/**/*"                 # 防止本地临时数据目录误打
  - "!backup*/**/*"              # 防止备份目录
  # --- 排除开发/配置类文件（.ts 源码只用于编译，运行时不需要） ---
  - "!*.ts"                      # tsconfig.tsbuildinfo / vite.config.ts / env.d.ts
  - "!tsconfig*.json"
  - "!*.config.{js,ts,mjs,cjs}"  # vite / postcss 等配置
  - "!*.sln;!*.suo;!*.user;!*.pdb"
  # --- 排除项目根目录的说明文件（大体积 txt 等） ---
  - "!*.txt"
  # --- 排除 node_modules 里典型的垃圾文件（体积能再减 1~3MB）---
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme,History.md,CHANGELOG,CHANGES,LICENSE,LICENCE,license,NOTICE}"
  - "!**/node_modules/*/{test,tests,spec,specs,example,examples,doc,docs,benchmark,benchmarks,coverage,__tests__,.github}/**"
  - "!**/node_modules/*/*.d.ts"
  - "!**/node_modules/*/*.flow"
  # --- 排除隐藏文件/系统垃圾/日志 ---
  - "!**/*.md"
  - "!**/*.{log,tmp,DS_Store,Thumbs.db,swp,swo}"
  - "!**/._*"

# 显式开启 asar 打包（默认 true，保险起见写死）
asar: true
# 原生模块不需要解包（本项目无原生 C++ addon）
asarUnpack: []

# 额外资源（图标等）
extraResources:
  - from: build/icon.ico
    to: icon.ico
    filter: ['**/*']

# Windows 打包配置
win:
  # 目标架构：同时支持 x64 和 ia32（32位）
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  # 图标文件（需要 256x256 .ico 格式）
  icon: build/icon.ico
  # 跳过代码签名（无证书时必须设置）
  signAndEditExecutable: false

# NSIS 安装程序配置
nsis:
  # 一键安装 vs 辅助安装
  oneClick: false
  # 【B 方案 asar 热更新要求】每用户安装（默认到 %LOCALAPPDATA%\Programs\河狸乐园登录器），
  # 这样替换 resources/app.asar 不需要管理员权限
  perMachine: false
  # 允许用户选择安装目录（注意：用户如果手动选了 C:\Program Files，asar 更新会因为 UAC 失败，需要提示用户重装时保持默认路径）
  allowToChangeInstallationDirectory: true
  # 在桌面创建快捷方式
  createDesktopShortcut: true
  # 在开始菜单创建快捷方式
  createStartMenuShortcut: true
  # 安装完成后运行应用
  runAfterFinish: true
  # 简体中文界面
  language: '2052'
  # 安装程序文件名模板（区分 64位/32位）
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

# 压缩配置（最大压缩，减小体积）
compression: maximum

# 自动更新发布配置
# electron-updater 会从该地址请求 latest.yml 并下载更新包
publish:
  - provider: generic
    url: http://117.72.202.12:3000/updates/

# 是否生成 portable 版本（免安装绿色版）
# 取消注释即可同时生成 portable 版本
# portable:
#   artifactName: ${productName}-Portable-${version}.${ext}
